<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hacer pedido · DB18</title>
<meta name="theme-color" content="#0f4a81">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f8;--surface:#fff;--ink:#15202c;--muted:#5a6878;--line:#dde3ea;--accent:#0f4a81;--accent-ink:#fff;--accent-soft:#e3ecf6;--warn:#9a5a00;--warn-soft:#fbeed6;--bad:#a3302a;--ok:#1d7a4f;--wa:#1f8f4e;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0f141b;--surface:#171e28;--ink:#e5ebf2;--muted:#94a2b3;--line:#283241;--accent:#7fb3ec;--accent-ink:#0a1b2e;--accent-soft:#1a2c44;--warn:#f0b45a;--warn-soft:#3a2c14;--bad:#f08a80;--ok:#5fd09a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-bottom:96px}
h1,h2{font-family:var(--f-display);margin:0;letter-spacing:-.01em}
.wrap{max-width:860px;margin:0 auto;padding:16px;display:grid;gap:14px}
header{display:flex;gap:12px;align-items:center}
.logo{width:76px;height:auto;background:#fff;border-radius:10px;padding:5px 7px;border:1px solid var(--line);flex:none}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.note{color:var(--muted);font-size:.88rem}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
label.f{display:grid;gap:4px;font-size:.85rem;color:var(--muted);font-weight:500}
input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
input:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;font-weight:500}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.wa{background:var(--wa);color:#fff;border-color:var(--wa);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{white-space:nowrap;border-radius:999px;padding:6px 12px;font-size:.85rem}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.search{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;display:grid;gap:8px}
.prods{display:grid;gap:8px}
.marca{font-family:var(--f-display);font-size:1.05rem;margin:8px 0 0}
.p{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:start}
.p.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.p img,.p .ni{width:72px;height:72px;border-radius:8px;object-fit:contain;background:#fff;border:1px solid var(--line)}
.p .ni{display:grid;place-items:center;color:var(--muted);font-size:.7rem}
.ref{font-weight:600;font-size:.9rem}
.desc{font-size:.85rem;color:var(--muted);margin-top:1px}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-top:6px}
.precio{font-family:var(--f-mono);font-weight:600;font-size:1.05rem}
.qty{display:flex;align-items:center;gap:6px;margin-top:8px}
.qty button{width:40px;height:40px;padding:0;font-size:1.2rem;line-height:1}
.qty input{width:84px;text-align:center;font-family:var(--f-mono);padding:8px 6px}
.warn{color:var(--warn);font-size:.8rem;font-weight:500}
.p.ago{opacity:.55}.p.ago img{filter:grayscale(1)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;border-radius:999px;padding:2px 9px}
.tag.ok{background:#e0f2e8;color:#1d7a4f}.tag.no{background:#f8e1df;color:#a3302a}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(15,40,70,.12);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:860px;margin:0 auto;display:flex;gap:12px;align-items:center}
.bar .tot{flex:1;min-width:0}
.bar .tot b{font-family:var(--f-mono);font-size:1.15rem}
.res{display:grid;gap:0}
.ri{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.ri:first-child{border-top:0}
.status{font-size:.9rem;padding:10px 12px;border-radius:8px;background:var(--accent-soft)}
.status.err{background:#f8e1df;color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.hidden{display:none!important}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:g .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes g{to{transform:rotate(360deg)}}
</style></head>

<script>
const SUPABASE_URL="https://iwuhgtshyospffaulenb.supabase.co";
const BASE=SUPABASE_URL+"/storage/v1/object/public/fotos/";
const WA="584126390349";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2=n=>Math.round((Number(n)||0)*100)/100;
const fmt=n=>"$"+r2(n).toLocaleString("es-VE",{minimumFractionDigits:2,maximumFractionDigits:2});
const fFecha=d=>{const x=new Date(d);return isNaN(x)?"":x.toLocaleDateString("es-VE",{day:"2-digit",month:"2-digit",year:"numeric"});};
const hoyTxt=()=>new Date().toLocaleDateString("es-VE",{day:"2-digit",month:"2-digit",year:"numeric"});
const MODO_CLI=new URLSearchParams(location.search).has("cliente");
const LS=MODO_CLI?"db18.pedidoCli":"db18.pedidoVend";
const fBs=n=>"Bs "+r2(n).toLocaleString("es-VE",{minimumFractionDigits:2,maximumFractionDigits:2});
let tasa=null;const bsDe=n=>tasa?fBs(n*tasa.tasa):"";
let prods=[],marca="TODAS",vista="cat";
let st={vend:"",cli:"",nota:"",items:{}};
try{st={...st,...JSON.parse(localStorage.getItem(LS)||"{}")};}catch(e){}
const guardar=()=>{try{localStorage.setItem(LS,JSON.stringify(st));}catch(e){}};

function paso(p){return Number(p.q)>0?Number(p.q):1;}
function avisoQty(p,n){const q=Number(p.q);if(!(n>0)||!(q>1))return "";
  if(n<q)return `Menos de una caja (la caja trae ${q})`;
  if(n%q)return `No completa cajas: la caja trae ${q}`;return "";}

function setQty(c,n){n=Math.max(0,Math.floor(Number(n)||0));if(n)st.items[c]=n;else delete st.items[c];guardar();pintarBar();
  const el=document.querySelector(`.p[data-c="${CSS.escape(c)}"]`);if(el){const p=prods.find(x=>x.c===c);el.classList.toggle("sel",n>0);const i=el.querySelector("input");if(document.activeElement!==i)i.value=n||"";const w=el.querySelector(".warn");w.textContent=avisoQty(p,n);}
  if(vista==="res")pintarRes();}

function pintarMarcas(){const ms=["TODAS",...new Set(prods.map(p=>p.m))];
  $("#marcas").innerHTML=ms.map(m=>`<button type="button" data-m="${esc(m)}" aria-pressed="${m===marca}">${m==="TODAS"?"Todas":esc(m)}</button>`).join("");
  $("#marcas").querySelectorAll("button").forEach(b=>b.onclick=()=>{marca=b.dataset.m;pintarMarcas();pintarProds();});}

function pintarProds(){const q=$("#q").value.trim().toLowerCase();
  const lista=prods.filter(p=>(marca==="TODAS"||p.m===marca)&&(!q||[p.r,p.d,p.c].some(v=>String(v||"").toLowerCase().includes(q))));
  if(!lista.length){$("#prods").innerHTML=`<div class="empty">No hay productos que coincidan con la búsqueda.</div>`;return;}
  let html="",ult="";
  for(const p of lista){if(p.m!==ult&&marca==="TODAS"&&!q){html+=`<div class="marca">${esc(p.m)}</div>`;ult=p.m;}
    const n=st.items[p.c]||0;
    if(p.a){html+=`<div class="p ago">${p.f?`<img src="${esc(BASE+p.f)}" alt="" loading="lazy">`:`<div class="ni">Sin foto</div>`}
      <div style="min-width:0"><div class="ref">${esc(p.r)}</div><div class="desc">${esc(p.d)}</div>
        <div class="meta"><span class="precio">${fmt(p.p)}</span><span class="tag no">AGOTADO</span></div></div></div>`;continue;}
    html+=`<div class="p${n?" sel":""}" data-c="${esc(p.c)}">${p.f?`<img src="${esc(BASE+p.f)}" alt="" loading="lazy">`:`<div class="ni">Sin foto</div>`}
      <div style="min-width:0"><div class="ref">${esc(p.r)}</div><div class="desc">${esc(p.d)}</div>
        <div class="meta"><span class="precio">${fmt(p.p)}</span>${tasa?`<span class="note num">${bsDe(p.p)}</span>`:""}<span class="note">por ${esc(p.u||"pieza")}${Number(p.q)>0?` · caja de ${p.q}`:""}</span><span class="tag ok">DISPONIBLE</span></div>
        <div class="qty"><button type="button" data-d="-1" aria-label="Quitar">−</button><input inputmode="numeric" aria-label="Cantidad de ${esc(p.r)}" value="${n||""}" placeholder="0"><button type="button" data-d="1" aria-label="Agregar">+</button></div>
        <div class="warn">${avisoQty(p,n)}</div></div></div>`;}
  $("#prods").innerHTML=html;
  $("#prods").querySelectorAll(".p[data-c]").forEach(el=>{const c=el.dataset.c,p=prods.find(x=>x.c===c),i=el.querySelector("input");
    el.querySelectorAll("button[data-d]").forEach(b=>b.onclick=()=>{const cur=st.items[c]||0,s=paso(p);let n;
      if(b.dataset.d==="1")n=cur<s?s:Math.floor(cur/s)*s+s;else n=cur%s?Math.floor(cur/s)*s:cur-s;setQty(c,Math.max(0,n));i.value=st.items[c]||"";});
    i.oninput=()=>setQty(c,i.value.replace(/\D/g,""));});}

function items(){return Object.entries(st.items).map(([c,n])=>({p:prods.find(x=>x.c===c),n})).filter(x=>x.p&&!x.p.a&&x.n>0);}
function total(){return r2(items().reduce((s,x)=>s+x.p.p*x.n,0));}
function pintarBar(){const it=items(),pz=it.reduce((s,x)=>s+x.n,0);
  $("#bar").classList.toggle("hidden",!it.length&&vista==="cat");
  $("#barN").textContent=it.length?`${it.length} producto${it.length>1?"s":""} · ${pz} pieza${pz>1?"s":""}`:"Pedido vacío";
  $("#barT").textContent=fmt(total())+(tasa&&total()?" · "+bsDe(total()):"");$("#btnVer").textContent=vista==="cat"?"Ver pedido":"Seguir agregando";}

function pintarRes(){const it=items();
  $("#resItems").innerHTML=it.length?it.map(({p,n})=>`<div class="ri"><div style="min-width:0"><div class="ref">${esc(p.r)}</div><div class="desc">${esc(p.d)}</div>
      <div class="note num">${n} × ${fmt(p.p)}</div>${avisoQty(p,n)?`<div class="warn">${esc(avisoQty(p,n))}</div>`:""}</div>
      <div style="display:grid;justify-items:end;gap:6px"><b class="num">${fmt(p.p*n)}</b><button type="button" data-x="${esc(p.c)}" style="padding:4px 10px;font-size:.8rem">Quitar</button></div></div>`).join(""):`<div class="empty">Todavía no agregaste productos.</div>`;
  $("#resTot").textContent=fmt(total())+(tasa?" · "+bsDe(total()):"");
  $("#resItems").querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>setQty(b.dataset.x,0));
  $("#enviar").disabled=$("#copiar").disabled=!it.length;}

function texto(){const it=items(),pz=it.reduce((s,x)=>s+x.n,0);
  const L=MODO_CLI?["*PEDIDO DB18 (cliente)*",`Cliente: ${st.cli.trim()}`,`Fecha: ${hoyTxt()}`,""]:["*PEDIDO DB18*",`Vendedor: ${st.vend.trim()}`,`Cliente: ${st.cli.trim()}`,`Fecha: ${hoyTxt()}`,""];
  it.forEach(({p,n},i)=>L.push(`${i+1}. *${p.r}* · ${p.d.length>60?p.d.slice(0,58)+"…":p.d}`,`    ${n} ${p.u||"PZA"} × ${fmt(p.p)} = ${fmt(p.p*n)}`));
  L.push("",`*TOTAL: ${fmt(total())}*`,...(tasa?[`En Bs: ${bsDe(total())} (tasa ${fBs(tasa.tasa)})`]:[]),`${it.length} producto${it.length>1?"s":""} · ${pz} pieza${pz>1?"s":""}`);
  if(st.nota.trim())L.push("",`Nota: ${st.nota.trim()}`);
  return L.join("\n");}
function validar(){const e=$("#resErr");const f=t=>{e.textContent=t;e.classList.remove("hidden");return false;};e.classList.add("hidden");
  if(!MODO_CLI&&!st.vend.trim()){$("#vend").focus();return f("Escribe tu nombre arriba.");}
  if(!st.cli.trim()){$("#cli").focus();return f(MODO_CLI?"Escribe tu nombre o el de tu negocio arriba.":"Escribe el nombre del cliente arriba.");}
  if(!items().length)return f("Agrega al menos un producto.");return true;}

function ver(v){vista=v;$("#cat").classList.toggle("hidden",v!=="cat");$("#resumen").classList.toggle("hidden",v!=="res");if(v==="res")pintarRes();pintarBar();window.scrollTo({top:0});}

if(MODO_CLI){document.title="Hacer pedido · Distribuidora Belidai 18";$("#fVend").classList.add("hidden");$("#campos").style.gridTemplateColumns="1fr";
  $("#lCli").textContent="Tu nombre o el de tu negocio";$("#cli").placeholder="Ej: Ferretería El Tornillo";$("#cli").autocomplete="organization";
  $("#nota").placeholder="Ej: forma de pago, dirección de entrega, etc.";
  $("#aQuien").textContent="Distribuidora Belidai 18";const h1=document.querySelector("header h1");if(h1)h1.textContent="Hacer pedido";
  fetch(BASE+"tasa-del-dia.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(t=>{if(!t||!(Number(t.tasa)>0))return;tasa=t;
    const d=new Date(t.fecha),hoy=d.toDateString()===new Date().toDateString();
    $("#tasaBox").innerHTML=`<div style="font-size:1.6rem">💱</div><div><div class="eyebrow">Tasa Binance del día</div><div class="num" style="font-size:1.35rem;font-weight:600">${fBs(t.tasa)} <span class="note" style="font-family:var(--f-body);font-weight:400">por $1</span></div>
      <div class="note">${hoy?"Actualizada hoy a las "+d.toLocaleTimeString("es-VE",{hour:"numeric",minute:"2-digit"}):"<b style='color:var(--warn)'>Del "+d.toLocaleDateString("es-VE")+": aún no se ha actualizado hoy</b>"}</div></div>`;
    $("#tasaBox").classList.remove("hidden");if(!$("#lnkDesc")){const l=document.createElement("a");l.id="lnkDesc";l.href="descuentos.html";l.textContent="🏷️ Ver descuentos por forma de pago";l.style.cssText="grid-column:1/-1;font-weight:600;color:var(--accent)";$("#tasaBox").appendChild(l);}pintarProds&&prods.length&&pintarProds();pintarBar();if(vista==="res")pintarRes();}).catch(()=>{});}
$("#vend").value=st.vend;$("#cli").value=st.cli;$("#nota").value=st.nota;
$("#vend").oninput=e=>{st.vend=e.target.value;guardar();};$("#cli").oninput=e=>{st.cli=e.target.value;guardar();};$("#nota").oninput=e=>{st.nota=e.target.value;guardar();};
$("#q").oninput=pintarProds;
$("#btnVer").onclick=()=>ver(vista==="cat"?"res":"cat");
$("#vaciar").onclick=()=>{if(!confirm("¿Vaciar el pedido?"))return;st.items={};if(!MODO_CLI){st.cli="";$("#cli").value="";}st.nota="";$("#nota").value="";guardar();pintarProds();ver("cat");};
$("#copiar").onclick=async()=>{if(!validar())return;try{await navigator.clipboard.writeText(texto());$("#copiar").textContent="✓ Copiado";setTimeout(()=>$("#copiar").textContent="Copiar pedido",2000);}catch(e){}};
$("#enviar").onclick=()=>{if(!validar())return;window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(texto()),"_blank");
  setTimeout(()=>{if(confirm(MODO_CLI?"¿Ya mandaste el pedido? Presiona Aceptar para empezar uno nuevo.":"¿Ya mandaste el pedido? Presiona Aceptar para empezar uno nuevo (tu nombre se queda guardado).")){st.items={};if(!MODO_CLI){st.cli="";$("#cli").value="";}st.nota="";$("#nota").value="";guardar();pintarProds();ver("cat");}},1500);};

(async()=>{try{const r=await fetch(BASE+"catalogo-vendedores.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(r.status);
    const j=await r.json();prods=(j.productos||[]).filter(p=>p.c&&p.p>0);
    const quitados=[];for(const c of Object.keys(st.items)){const p=prods.find(x=>x.c===c);if(!p||p.a){if(p)quitados.push(p.r);delete st.items[c];}}guardar();
    if(quitados.length)setTimeout(()=>alert("Se quitaron de tu pedido porque se agotaron: "+quitados.join(", ")),300);
    $("#act").textContent=j.publicado?`Precios actualizados el ${fFecha(j.publicado)}`:"";
    $("#estado").classList.add("hidden");$("#cat").classList.remove("hidden");pintarMarcas();pintarProds();pintarBar();
  }catch(e){$("#estado").className="status err";$("#estado").textContent="No se pudieron cargar los productos. Revisa tu conexión y recarga la página. Si sigue igual, avisa a la oficina.";}})();
</script>
