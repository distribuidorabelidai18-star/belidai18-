<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Consultas · DB18</title>
<meta name="theme-color" content="#0f4a81">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f8;--surface:#fff;--ink:#15202c;--muted:#5a6878;--line:#dde3ea;--accent:#0f4a81;--accent-ink:#fff;--accent-soft:#e3ecf6;--warn:#9a5a00;--warn-soft:#fbeed6;--bad:#a3302a;--ok:#1d7a4f;--wa:#1f8f4e;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0f141b;--surface:#171e28;--ink:#e5ebf2;--muted:#94a2b3;--line:#283241;--accent:#7fb3ec;--accent-ink:#0a1b2e;--accent-soft:#1a2c44;--warn:#f0b45a;--warn-soft:#3a2c14;--bad:#f08a80;--ok:#5fd09a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-bottom:96px}
h1,h2{font-family:var(--f-display);margin:0;letter-spacing:-.01em}
.wrap{max-width:860px;margin:0 auto;padding:16px;display:grid;gap:14px}
header{display:flex;gap:12px;align-items:center}
.logo{width:76px;height:auto;background:#fff;border-radius:10px;padding:5px 7px;border:1px solid var(--line);flex:none}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.note{color:var(--muted);font-size:.88rem}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
label.f{display:grid;gap:4px;font-size:.85rem;color:var(--muted);font-weight:500}
input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
input:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;font-weight:500}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.wa{background:var(--wa);color:#fff;border-color:var(--wa);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{white-space:nowrap;border-radius:999px;padding:6px 12px;font-size:.85rem}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.search{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;display:grid;gap:8px}
.prods{display:grid;gap:8px}
.marca{font-family:var(--f-display);font-size:1.05rem;margin:8px 0 0}
.p{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:start}
.p.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.p img,.p .ni{width:72px;height:72px;border-radius:8px;object-fit:contain;background:#fff;border:1px solid var(--line)}
.p .ni{display:grid;place-items:center;color:var(--muted);font-size:.7rem}
.ref{font-weight:600;font-size:.9rem}
.desc{font-size:.85rem;color:var(--muted);margin-top:1px}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-top:6px}
.precio{font-family:var(--f-mono);font-weight:600;font-size:1.05rem}
.qty{display:flex;align-items:center;gap:6px;margin-top:8px}
.qty button{width:40px;height:40px;padding:0;font-size:1.2rem;line-height:1}
.qty input{width:84px;text-align:center;font-family:var(--f-mono);padding:8px 6px}
.warn{color:var(--warn);font-size:.8rem;font-weight:500}
.p.ago{opacity:.55}.p.ago img{filter:grayscale(1)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;border-radius:999px;padding:2px 9px}
.tag.ok{background:#e0f2e8;color:#1d7a4f}.tag.no{background:#f8e1df;color:#a3302a}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(15,40,70,.12);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:860px;margin:0 auto;display:flex;gap:12px;align-items:center}
.bar .tot{flex:1;min-width:0}
.bar .tot b{font-family:var(--f-mono);font-size:1.15rem}
.res{display:grid;gap:0}
.ri{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.ri:first-child{border-top:0}
.status{font-size:.9rem;padding:10px 12px;border-radius:8px;background:var(--accent-soft)}
.status.err{background:#f8e1df;color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.hidden{display:none!important}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:g .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes g{to{transform:rotate(360deg)}}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs button{padding:12px 6px;font-weight:600;display:grid;gap:2px;justify-items:center;font-size:.88rem}
.tabs button span{font-size:1.3rem}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.big{font-family:var(--f-mono);font-weight:600;font-size:2rem;letter-spacing:-.02em}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi .v{font-family:var(--f-mono);font-weight:600;font-size:1.25rem}
.kpi.bad .v{color:var(--bad)}
.nt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.nt:first-of-type{border-top:0}
.vencida{color:var(--bad);font-weight:600;font-size:.8rem}
.bs{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
a.wa{display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;background:var(--wa);color:#fff;border-radius:8px;padding:9px 14px;font-weight:600}
a.wa.sm{padding:6px 10px;font-size:.82rem;margin-top:8px}
.foot{display:grid;gap:8px;justify-items:center;text-align:center;padding:10px 0 20px}
</style></head>

  <div class="tabs" role="group" aria-label="Qué quieres consultar">
    <button type="button" data-t="cuenta" aria-pressed="false"><span>🧾</span>Cuánto debo</button>
    <button type="button" data-t="tasa" aria-pressed="false"><span>💱</span>Tasa del día</button>
    <button type="button" data-t="prod" aria-pressed="false"><span>📦</span>Productos</button>
  </div>

  <section id="v-cuenta" class="hidden"></section>

  <section id="v-tasa" class="hidden"><div class="card" id="tasaBox"><div class="note"><span class="spin"></span>Cargando…</div></div></section>

  <section id="v-prod" class="hidden">
    <div id="estado" class="status"><span class="spin"></span>Cargando productos…</div>
    <div id="cat" class="hidden">
      <div class="search">
        <input id="q" type="search" placeholder="Escribe la referencia o lo que buscas" aria-label="Buscar producto">
        <div class="chips" id="marcas" role="group" aria-label="Marca"></div>
      </div>
      <div class="prods" id="prods"></div>
    </div>
  </section>

  <div class="foot">
    <div class="note">¿Necesitas algo más? Escríbenos y te respondemos apenas podamos.</div>
    <a class="wa" id="waGen" target="_blank" rel="noopener">💬 Escribir por WhatsApp</a>
  </div>
</div>

<script>
const BASE="https://iwuhgtshyospffaulenb.supabase.co/storage/v1/object/public/fotos/";
const WA="584126390349";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2=n=>Math.round((Number(n)||0)*100)/100;
const fmt=n=>"$"+r2(n).toLocaleString("es-VE",{minimumFractionDigits:2,maximumFractionDigits:2});
const fBs=n=>"Bs "+r2(n).toLocaleString("es-VE",{minimumFractionDigits:2,maximumFractionDigits:2});
const fF=d=>{if(!d)return "";const m=String(d).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}/${m[2]}/${m[1]}`:"";};
const waLink=t=>`https://wa.me/${WA}?text=${encodeURIComponent(t)}`;
const pide=n=>fetch(BASE+n+"?t="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();});
const hoyISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const tok=(new URLSearchParams(location.search).get("c")||"").replace(/[^a-f0-9]/gi,"");
let tasa=null,prods=[],marca="TODAS",cuenta=null;
$("#waGen").href=waLink("Hola, tengo una consulta.");

function ver(t){document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===t));
  ["cuenta","tasa","prod"].forEach(x=>$("#v-"+x).classList.toggle("hidden",x!==t));
  if(t==="prod"&&!prods.length)cargarProds();}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>ver(b.dataset.t));

/* ---- Tasa ---- */
const tasaP=pide("tasa-del-dia.json").then(t=>{if(Number(t.tasa)>0)tasa=t;}).catch(()=>{}).finally(()=>{pintarTasa();if(prods.length)pintarProds();if(cuenta)pintarCuenta();});
function esHoy(){if(!tasa?.fecha)return false;const d=new Date(tasa.fecha);return d.toDateString()===new Date().toDateString();}
function pintarTasa(){const b=$("#tasaBox");
  if(!tasa){b.innerHTML=`<div class="eyebrow">Tasa del día</div><div>Todavía no se ha publicado la tasa de hoy.</div><a class="wa" href="${waLink("Hola, ¿cuál es la tasa de hoy?")}" target="_blank" rel="noopener">💬 Preguntar por WhatsApp</a>`;return;}
  const d=new Date(tasa.fecha);
  b.innerHTML=`<div class="eyebrow">Tasa Binance</div><div class="big">${fBs(tasa.tasa)}</div><div class="note">por cada $1 · ${esHoy()?"actualizada hoy a las "+d.toLocaleTimeString("es-VE",{hour:"numeric",minute:"2-digit"}):"<b style='color:var(--warn)'>publicada el "+d.toLocaleDateString("es-VE")+", aún no se ha actualizado hoy</b>"}</div>
    <label class="f">Convertir dólares a bolívares<input id="conv" inputmode="decimal" placeholder="Monto en $"></label><div class="num" id="convR" style="font-size:1.1rem"></div>`;
  $("#conv").oninput=()=>{const v=Number($("#conv").value.replace(/\./g,"").replace(",","."))||0;$("#convR").textContent=v?`${fmt(v)} = ${fBs(v*tasa.tasa)}`:"";};}

/* ---- Estado de cuenta ---- */
async function cargarCuenta(){const v=$("#v-cuenta");
  if(!tok){v.innerHTML=`<div class="card"><h2 style="font-size:1.15rem">Tu estado de cuenta</h2><div>Para ver cuánto debes, usa el enlace personal que te enviamos por WhatsApp. Si no lo tienes, pídelo y te lo mandamos.</div><a class="wa" href="${waLink("Hola, quiero el enlace para ver mi estado de cuenta.")}" target="_blank" rel="noopener">💬 Pedir mi enlace</a></div>`;return;}
  v.innerHTML=`<div class="card"><div class="note"><span class="spin"></span>Buscando tu cuenta…</div></div>`;
  try{cuenta=await pide("cuenta-"+tok+".json");await tasaP;pintarCuenta();}
  catch(e){v.innerHTML=`<div class="card"><h2 style="font-size:1.15rem">Este enlace ya no está activo</h2><div>Pídenos uno nuevo por WhatsApp y te lo mandamos.</div><a class="wa" href="${waLink("Hola, mi enlace de estado de cuenta ya no funciona, ¿me mandan uno nuevo?")}" target="_blank" rel="noopener">💬 Pedir enlace nuevo</a></div>`;}}
function pintarCuenta(){const c=cuenta,v=$("#v-cuenta");if(!c)return;const bs=n=>tasa?`<div class="bs">${fBs(n*tasa.tasa)}</div>`:"";
  const act=c.actualizado?new Date(c.actualizado):null;
  v.innerHTML=`<div class="card"><div><div class="eyebrow">Estado de cuenta</div><h2 style="font-size:1.2rem">${esc(c.nombre)}</h2></div>
    ${c.total>0.009?`<div class="kpis"><div class="kpi"><div class="note">Total que debes</div><div class="v">${fmt(c.total)}</div>${bs(c.total)}</div>
      <div class="kpi${c.vencido>0.009?" bad":""}"><div class="note">Vencido</div><div class="v">${fmt(c.vencido)}</div>${c.vencido>0.009?bs(c.vencido):""}</div></div>`
      :`<div class="status" style="background:#e0f2e8;color:#1d7a4f;font-weight:600">✓ Estás al día. No tienes saldo pendiente.</div>`}
    ${c.notas.length?`<div><div class="eyebrow" style="margin-bottom:4px">Notas pendientes</div>${c.notas.map(n=>`<div class="nt"><div><b>Nota ${esc(n.numero)}</b><div class="note">Emitida ${fF(n.fecha)}${n.vence?" · vence "+fF(n.vence):""}</div>${n.dv>0?`<div class="vencida">Vencida hace ${n.dv} día${n.dv>1?"s":""}</div>`:""}</div>
      <div style="text-align:right"><b class="num">${fmt(n.saldo)}</b>${n.saldo<n.monto-0.009?`<div class="note">de ${fmt(n.monto)}</div>`:""}</div></div>`).join("")}</div>`:""}
    ${c.pagos?.length?`<div><div class="eyebrow" style="margin-bottom:4px">Últimos pagos recibidos</div>${c.pagos.map(p=>`<div class="nt"><div>${fF(p.fecha)}${p.numero?` <span class="note">· nota ${esc(p.numero)}</span>`:""}</div><b class="num">${fmt(p.monto)}</b></div>`).join("")}</div>`:""}
    ${tasa&&c.total>0.009?`<div class="note">Montos en Bs a tasa Binance ${fBs(tasa.tasa)}${esHoy()?" de hoy":" (no es la de hoy)"}.</div>`:""}
    <div class="note">Actualizado ${act?act.toLocaleDateString("es-VE")+" "+act.toLocaleTimeString("es-VE",{hour:"numeric",minute:"2-digit"}):""} · Si ya pagaste y no aparece, puede que aún no lo hayamos registrado.</div>
    <a class="wa" href="${waLink(`Hola, soy ${c.nombre}. Quiero reportar un pago / consultar mi estado de cuenta.`)}" target="_blank" rel="noopener">💬 Reportar un pago o preguntar</a></div>`;}

/* ---- Productos ---- */
let _cargando=false;
async function cargarProds(){if(_cargando)return;_cargando=true;
  try{const d=await pide("catalogo-vendedores.json");prods=(d.productos||d.items||[]).filter(p=>p&&p.r);
    $("#estado").classList.add("hidden");$("#cat").classList.remove("hidden");pintarMarcas();pintarProds();}
  catch(e){$("#estado").className="status err";$("#estado").textContent="No se pudieron cargar los productos. Intenta de nuevo en un rato o escríbenos por WhatsApp.";_cargando=false;}}
function pintarMarcas(){const ms=["TODAS",...new Set(prods.map(p=>p.m).filter(Boolean))];
  $("#marcas").innerHTML=ms.map(m=>`<button type="button" data-m="${esc(m)}" aria-pressed="${m===marca}">${m==="TODAS"?"Todas":esc(m)}</button>`).join("");
  $("#marcas").querySelectorAll("button").forEach(b=>b.onclick=()=>{marca=b.dataset.m;pintarMarcas();pintarProds();});}
function pintarProds(){if(!prods.length)return;const q=$("#q").value.trim().toLowerCase();
  const lista=prods.filter(p=>(marca==="TODAS"||p.m===marca)&&(!q||[p.r,p.d,p.c,p.m].some(v=>String(v||"").toLowerCase().includes(q))));
  if(!lista.length){$("#prods").innerHTML=`<div class="empty">No encontramos "${esc(q)}".<br><br><a class="wa" href="${waLink("Hola, ¿tienen "+q+"?")}" target="_blank" rel="noopener">💬 Preguntar por WhatsApp</a></div>`;return;}
  const MAX=150;let html="",ult="";
  for(const p of lista.slice(0,MAX)){if(p.m!==ult&&marca==="TODAS"&&!q){html+=`<div class="marca">${esc(p.m)}</div>`;ult=p.m;}
    html+=`<div class="p${p.a?" ago":""}">${p.f?`<img src="${esc(BASE+p.f)}" alt="" loading="lazy">`:`<div class="ni">Sin foto</div>`}
      <div style="min-width:0"><div class="ref">${esc(p.r)}</div><div class="desc">${esc(p.d)}</div>
        <div class="meta"><span class="precio">${fmt(p.p)}</span>${tasa?`<span class="bs">${fBs(p.p*tasa.tasa)}</span>`:""}<span class="note">por ${esc(p.u||"pieza")}${Number(p.q)>0?` · caja de ${p.q}`:""}</span>${p.a?`<span class="tag no">AGOTADO</span>`:`<span class="tag ok">DISPONIBLE</span>`}</div>
        ${p.a?"":`<a class="wa sm" target="_blank" rel="noopener" href="${waLink(`Hola, me interesa ${p.r} (${p.d}).`)}">💬 Lo quiero</a>`}</div></div>`;}
  if(lista.length>MAX)html+=`<div class="empty">Hay ${lista.length-MAX} productos más. Escribe la referencia para encontrarla.</div>`;
  $("#prods").innerHTML=html;}
$("#q").oninput=pintarProds;

/* ---- Inicio ---- */
const t0=new URLSearchParams(location.search).get("v");
cargarCuenta();
ver(["cuenta","tasa","prod"].includes(t0)?t0:tok?"cuenta":"prod");
</script>
</body></html>
